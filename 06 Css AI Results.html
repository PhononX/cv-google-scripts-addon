<style>
  .container {
    margin: 10px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .section-title {
    color: #261073;
    font-size: 15px;
    font-weight: 600;
    margin: 10px 0 0 0;
  }

  .dropdown {
    position: relative;
  }

  .dropdown-button {
    width: 100%;
    padding: 16px;
    background: white;
    border: 1px solid #E0E0E0;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 16px;
    color: #1A1A1A;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }

  .dropdown-content {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border: 1px solid #E0E0E0;
    border-radius: 12px;
    margin-top: 4px;
    max-height: 300px;
    overflow-y: auto;
    z-index: 1000;
    display: none;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }

  .dropdown-content.show {
    display: block;
  }

  .dropdown-item {
    padding: 12px 16px;
    cursor: pointer;
  }

  .dropdown-item:hover {
    background: #F5F5F5;
  }

  .metadata {
    /* display: flex;
    align-items: center; */
    gap: 16px;
    color: #A1A2AB;
    font-size: 12px;
    margin-top: 8px;

  .metadata-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .result-container {
    margin-top: 4px;
    background: #ffffff;
    border: 1px solid #E0E0E0;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    line-height: 1.5;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }

  .result-container h3{
    font-size: 16px;
  }

  .result-container li {
    margin: 10px;
  }
