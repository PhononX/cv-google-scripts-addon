<script>
  let selectedMemoIds = new Set();

  function getSelectedVoiceMemoIds() {
    return Array.from(selectedMemoIds);
  }

  function createInstruction(outlinesDiv) {
    const instruction = document.createElement('div');
    instruction.innerHTML = `<h1>No voice memos found</h1>
    To create one:
    <ol class="instruction-list">
    <li class="instruction-step">
      <div class="step-number">1</div>
      <div class="step-text">Open your Carbon Voice</div>
    </li>
    <li class="instruction-step">
      <div class="step-number">2</div>
      <div class="step-text">Navigate to the folder</div>
    </li>
    <li class="instruction-step">
      <div class="step-number">3</div>
      <div class="step-text">Record a voice memo</div>
    </li>    
  </ol>
After the voice memo is recorded, tap the refresh button.`;
    instruction.className = 'instruction';
    outlinesDiv.appendChild(instruction);
  }

  function populateOutlines(sidebarData) {
    voiceMemosAndFoldersSidebar = sidebarData;
    selectedMemoIds = new Set();

    const bottomPanel = document.getElementById('bottomPanel');
    bottomPanel.style.display = 'none';

    const { voiceMemos, showNext, showPrevious, workspaceId, folderName, folderId, workspaceName, folders, pageNumber, path } = sidebarData;

    // voiceMemos=[];
    // folders = [];

    const breadcrumbs = generateBreadcrumbs(
      path,
      folderName,
      folderId,
      workspaceId,
      workspaceName,
      pageNumber
    );
    renderBreadcrumbs(breadcrumbs);

    const presentations = voiceMemos;

    const outlinesDiv = document.getElementById('outlines');
    outlinesDiv.innerHTML = ``;

    if (presentations.length === 0 && folders.length === 0) {
      createInstruction(outlinesDiv);
    } else {

      createNavigation(showNext, showPrevious, workspaceId, folderId, pageNumber);


      // Reload button
      let reloadBtn = document.getElementById('reload-button');

      const newReloadBtn = reloadBtn.cloneNode(true);
      reloadBtn.parentNode.replaceChild(newReloadBtn, reloadBtn);
      reloadBtn = document.getElementById('reload-button');
      reloadBtn.addEventListener('click', (e) => {
        // console.log('workspaceId, folderId, pageNumber', workspaceId, folderId, pageNumber);
        e.stopPropagation();
        disableAllInteractions();

        const icon = reloadBtn.querySelector('.svg-icon-reload');
        icon.classList.add('spinning');

        hideMessage('messageConversations');
        google.script.run
          .withSuccessHandler(onRefreshSuccess)
          .withFailureHandler(onExportFailure)
          .getVoiceMemosAndFolders(workspaceId, folderId, pageNumber);
      });
      // End. Reload button

      const outlineList = document.createElement('div');
      outlineList.className = 'outline-list';

      populateFolders(folders, outlineList, workspaceId);

      let currentDetailsBlock = null;
      let currentDetailsBlockParent = null;

      presentations.forEach(presentation => {
        const item = document.createElement('div');
        item.dataset.voiceMemoId = presentation.messageId;

        const formattedDateTime = formatDateTime(presentation.createdAt);
        presentation.formattedDateTime = formattedDateTime;

        const globeOrLockIcon = presentation.public ? 'globe-icon' : 'lock-icon';

        item.className = 'outline-item';
        item.innerHTML = ` <div class="border-wrapper">   <div class="content-wrapper">
      <div class="icon voice-memo-icon main-icon"></div>
      <div class="text-content">
        <h3 class="title">${presentation.name}</h3>
        <div class="metadata-voice-memo">
          <div class="date-time">
          <div class="icon ${globeOrLockIcon}"></div>
            <span>${formattedDateTime}</span>
          </div>
          <div class="sound-info">
            <div class="icon sound-bar-icon"></div>
            <span>${convertMillisecondsToMinutesSeconds(presentation.durationMs)}</span>
          </div>
        </div>
      </div>
    </div></div>`;

        const icon = item.querySelector('.main-icon');

        item.addEventListener('click', () => {
          const memoId = item.dataset.voiceMemoId;
          const isCurrentlySelected = selectedMemoIds.has(memoId);

          if (isCurrentlySelected) {
            // If this was the only selected item, reset all icons
            if (selectedMemoIds.size === 1) {
              document.querySelectorAll('.outline-item .main-icon').forEach(i => {
                i.className = 'icon voice-memo-icon main-icon';
              });
              selectedMemoIds.clear();
            } else {
              // Otherwise, just unselect this item
              icon.className = 'icon checkbox-icon main-icon';
              selectedMemoIds.delete(memoId);
            }
          } else {
            // If this is the first selection
            if (selectedMemoIds.size === 0) {
              document.querySelectorAll('.outline-item .main-icon').forEach(i => {
                if (i !== icon) {
                  i.className = 'icon checkbox-icon main-icon';
                }
              });
            }
            icon.className = 'icon selected-checkbox-icon main-icon';
            selectedMemoIds.add(memoId);
          }

          // bottomPanel
          const bottomPanel = document.getElementById('bottomPanel');
          if (selectedMemoIds.size === 0) {
            bottomPanel.style.display = 'none';
          } else {
            bottomPanel.style.display = 'flex';
            const pasteLinkButton = document.getElementById('pasteLinkButton');
            const emptyButton = document.getElementById('emptyButton');
            if (selectedMemoIds.size > 1) {
              //empty-icon-button
              pasteLinkButton.style.display = 'none';
              emptyButton.style.display = 'flex';
            } else {
              pasteLinkButton.style.display = 'flex';
              emptyButton.style.display = 'none';
            }
          }
        });

        outlineList.appendChild(item);
      });

      outlinesDiv.appendChild(outlineList);
    }
  }
</script>
