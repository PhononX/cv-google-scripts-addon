<script>

function onSuccessPasteLink(response) {
    if (response.status === 'error') {
        if (!response.hasAccess) {
            document.getElementById('authUrl').value = response.authUrl;
            showScreen('screen1');
        } else {
            showNotification(response.message, 'error', 'bottomNotification');
        }
    } else {
      if (response.message){     
        showNotification(response.message, 'success', 'bottomNotification');
      }
    }
    enableAllInteractions();
}

function onFailurePasteLink(error) {
    showNotification('Failed to paste. ' + error, 'error', 'bottomNotification');
    enableAllInteractions();
}
