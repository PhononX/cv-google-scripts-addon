<style>
  .container {
    position: relative;
    width: 30px;
    height: 30px;
    flex-shrink: 0;
  }

  .c-letter {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    border-radius: 50%;
  }

  .named {
    border-radius: 4px;
  }

  .leaves {
    position: absolute;
    background-color: #ffffff;
    border: solid 1px #ffffff;
    width: 12px;
    height: 12px;
    bottom: -1px;
    right: -1px;
    object-fit: cover;
    border-radius: 2px;
    z-index: 1;
  }

  /* Tooltip styles */
  .tooltip {
    position: absolute;
    top: -5px;
    left: -15px;
    transform: translateY(-100%);
    padding: 4px 8px;
    background: #212529;
    color: white;
    border-radius: 4px;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
    z-index: 1;

    min-width: 40px;
    max-width: 250px;
    width: max-content;
    /* Use as much width as needed for content */
    white-space: normal;
    /* Allow text to wrap */
    text-align: left;
  }

  /* .creator .tooltip {
    white-space: nowrap;
  } */

  .tooltip::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 30px;
    transform: translateX(-50%);
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 4px solid #212529;
  }


  .container:hover .tooltip {
    opacity: 1;
  }
</style>
