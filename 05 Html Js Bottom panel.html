<script>
let selectedMessageSummary;
let aiMagicMenu = false;
    function handleMagic() {
      aiMagicMenu = true;

      selectedMessageSummary=null;
      const shortMenu = document.getElementById('shortMenu');
      shortMenu.style.display = shortMenu.style.display === 'block' ? 'none' : 'block';
      document.getElementById('fullMenu').style.display = 'none';

      disableAllInteractions();

      const selectedIds = getSelectedVoiceMemoIds();
      // console.log(selectedIds);

      let currentCategory = null;
      let menuHTML = '';
      let maxItemsInShortMenu = aiActions.length > 2 ? 2: aiActions.length;

      if (selectedIds.length === 1){
        const voiceMemos = voiceMemosAndFoldersSidebar.voiceMemos;
        for (let i in voiceMemos){
          selectedMessageSummary = voiceMemos[i].summary;
          if (selectedIds[0] === voiceMemos[i].messageId && selectedMessageSummary){
            menuHTML += `
                    <div class="menu-item menu-item-short" onclick="showDefaultSummary()">Summary</div><div class="item-divider"></div>`;
            maxItemsInShortMenu--;
            break;
          }
        }
      }

      for (let index = 0; index < maxItemsInShortMenu; index++){
        const action = aiActions[index];
        if (currentCategory !== action.categoryNumber) {
          if (currentCategory !== null) {
            menuHTML += '<div class="category-divider"></div>';
          }
          currentCategory = action.categoryNumber;
        } else if (index > 0) {
          menuHTML += '<div class="item-divider"></div>';
        }

        menuHTML += `
          <div class="menu-item menu-item-short" onclick="runAiMagic('${action.id}')">${action.name}</div>`;
      }

      document.getElementById('shortMenuContent').innerHTML = menuHTML;

    }

    function closeFullMenu() {
      document.getElementById('fullMenu').style.display = 'none';
      document.getElementById('screen2').style.display = 'block';
      enableAllInteractions();
    }


    function showFullMenu() {
      document.getElementById('screen2').style.display = 'none';
      document.getElementById('shortMenu').style.display = 'none';
      const fullMenu = document.getElementById('fullMenu');
      fullMenu.style.display = 'block';
      
      const sortedActions = [...aiActions].sort((a, b) => {
        if (a.categoryNumber !== b.categoryNumber) {
          return a.categoryNumber - b.categoryNumber;
        }
        return a.orderInCategory - b.orderInCategory;
      });

      let currentCategory = null;
      let menuHTML = '';

      sortedActions.forEach((action, index) => {
        if (currentCategory !== action.categoryNumber) {
          if (currentCategory !== null) {
            menuHTML += '<div class="category-divider"></div>';
          }
          currentCategory = action.categoryNumber;
        } else if (index > 0) {
          menuHTML += '<div class="item-divider"></div>';
        }

        menuHTML += `
          <div class="menu-item" onclick="runAiMagic('${action.id}')">${action.name}</div>`;
      });

      document.getElementById('menuContent').innerHTML = menuHTML;
    }

    function createDotsContainer() {
      const dotsContainer = document.createElement('div');
      dotsContainer.className = 'dots-container-ai-menu';
      
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('div');
        dot.className = 'dot-ai-menu';
        dotsContainer.appendChild(dot);
      }
      
      return dotsContainer;
    }

let clickedItem;
let clickedAiActionName;
    function runAiMagic(promptId) {
      const selectedIds = getSelectedVoiceMemoIds();
      let action;
      // if (id === 'defaultSummary'){
      //   action = {name: 'Summary'};
      //   showAiResults(name, text)
      //   return;
      // }else{
        action = aiActions.find(a => a.id === promptId);
        if (!action) return;
      // }

      // Find the clicked menu item
      const menuItems = document.querySelectorAll('.menu-item');

      menuItems.forEach(item => {
        if (item.textContent === action.name) {
          // console.log('item.textContent === action.name')
          clickedAiActionName = action.name;
          clickedItem = item;
          // Add processing class and append dots
          item.classList.add('processing');
          // Create and append dots only when clicked
          const dots = createDotsContainer();
          item.appendChild(dots);
        }
      });

  // Disable all clickable elements
  const clickableElements = document.querySelectorAll('button, .menu-item');
  clickableElements.forEach(el => el.classList.add('disabled'));
      google.script.run
        .withSuccessHandler(onAiMagicSuccess)
        .withFailureHandler(onAiMagicFailure)
        .runAiMagicApi(promptId, selectedIds);  
    }

    if (response.status === 'error') {
        if (!response.hasAccess) {
            document.getElementById('authUrl').value = response.authUrl;
            showScreen('screen1');
        } else {
            showMessage(response.message, 'error', 'successMessage');
        }
    } else {
      if (response.message){
        showMessage(response.message, 'success', 'successMessage');
        // const textInput = document.getElementById('textInput');
        // textInput.value = '';
      }
      const clickableElements = document.querySelectorAll('button, .menu-item');
      clickableElements.forEach(el => el.classList.remove('disabled'));
      if (clickedItem) {
        // Remove processing class and dots
        clickedItem.classList.remove('processing');
        const dots = clickedItem.querySelector('.dots-container');
        if (dots) {
          dots.remove();
        }
      }
      showAiResults(clickedAiActionName, response.aiResultHtml, response.aiResultText);
    }

    if (response.status === 'error') {
