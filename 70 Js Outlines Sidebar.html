<script>
  function enableAllInteractions(){
    document.querySelectorAll('.outline-item, .action-button, .reload-button').forEach(el => {
      el.style.pointerEvents = 'auto';
      el.style.opacity = '1';

      // If this is an action button, hide its progress span
      if (el.classList.contains('action-button')) {
        const span = el.querySelector('.progressButton');
        if (span) span.style.display = 'none';
      }
      const reloadBtn = document.getElementById('reload-button');
      const icon = reloadBtn.querySelector('.svg-icon-reload');
      icon.classList.remove('spinning');
    });

    const textInput = document.getElementById('textInput');
    const generateBtn = document.getElementById('generateBtn');
    const reloadButton = document.getElementById('reload-button');
    textInput.disabled = false;
    reloadButton.disabled = false;
    generateBtn.disabled = textInput.value === '' ? true : false;
  }

  function disableAllInteractions(){
    document.querySelectorAll('.outline-item, .action-button, .reload-button').forEach(el => {
      el.style.pointerEvents = 'none';
      el.style.opacity = '0.6';
    });

    const textInput = document.getElementById('textInput');
    textInput.disabled = true;

    const generateBtn = document.getElementById('generateBtn');
    generateBtn.disabled = true;

    const reloadButton = document.getElementById('reload-button');
    reloadButton.disabled = true;
  }

  function populateOutlines(presentations, publicSharedVoiceMemos) {
    // presentations=[];
    const outlinesDiv = document.getElementById('outlines');
    outlinesDiv.innerHTML = '';

    if (presentations.length === 0) {
      const instruction = document.createElement('div');
      instruction.innerHTML = `<h1>No “Presentation Outline” AI&nbsp;Magic results found</h1>
    To create one:
    <ol class="instruction-list">
    <li class="instruction-step">
      <div class="step-number">1</div>
      <div class="step-text">Open your Carbon Voice</div>
    </li>
    <li class="instruction-step">
      <div class="step-number">2</div>
      <div class="step-text">Press & hold on a message or Voice Memo that talks about a presentation</div>
    </li>
    <li class="instruction-step">
      <div class="step-number">3</div>
      <div class="step-text">Select “AI Magic”</div>
    </li>
    <li class="instruction-step">
      <div class="step-number">4</div>
      <div class="step-text">Tap on “More AI Magic”</div>
    </li>
    <li class="instruction-step">
      <div class="step-number">5</div>
      <div class="step-text">Select “Presentation Outline”</div>
    </li>
  </ol>
After the result is created, tap refresh button.`;
      instruction.className = 'instruction';
      outlinesDiv.appendChild(instruction);
    }

    const outlineList = document.createElement('div');
    outlineList.className = 'outline-list';

    let currentDetailsBlock = null;
    let currentDetailsBlockParent = null;

    presentations.forEach(presentation => {

      if (presentation.success === true) {
        // Correct AI result

        const outlinesJson = presentation.aiResultJson.presentation_outline;
        const additionalSuggestionsJson = presentation.aiResultJson.additional_suggestions;
        const formattedDateTime = formatDateTime(presentation.createdAt);
        presentation.formattedDateTime = formattedDateTime;

        let aiResultIcon;
        if (presentation.groupType === 'channel') {
          let convImageClass = presentation.conversationType === 'directMessage' ? '' : 'named';
          aiResultIcon = `<div class="container">
          <!-- Conversation image as the main background -->
          <img src="${presentation.conversationImageUrl}" class="c-letter ${convImageClass}">
          <!-- Small workspace image overlaid on top -->
          <img src="${presentation.workspaceImageUrl}" class="leaves">
          <div class="tooltip">${presentation.workspaceName}: ${presentation.conversationName}</div>
        </div>`;
        } else {
          aiResultIcon = '<div class="icon voice-memo-icon"></div>';
        }

        const item = document.createElement('div');
        item.className = 'outline-item';
        item.innerHTML = ` <div class="border-wrapper">   <div class="content-wrapper">
      ${aiResultIcon}     
      <div class="text-content">
        <h3 class="title">${presentation.aiResultName}</h3>
        <div class="metadata">
          <div class="date-time">
            <span>${formattedDateTime}</span>
          </div>
          <div class="sound-info">
            <div class="icon sound-bar-icon"></div>
            <span>${convertMillisecondsToMinutesSeconds(presentation.durationMs)}</span>
          </div>
        </div>
      </div>
    </div></div>`;

        const voiceMemoSources = document.createElement('div');
        voiceMemoSources.className = 'voice-memo-sources';
        voiceMemoSources.style.display = 'none';

        // Display all sources
        presentation.messages.forEach((memo, index) => {

          let messageType, voiceMemoIconUrl, sourceHtml;
          let globeOrLockIcon;

          const imageUrl = memo.imageUrl == null ? "https://pxassets.s3.us-east-2.amazonaws.com/images/personal.png" : memo.imageUrl;
          const formattedDateTime = formatDateTime(memo.createdAt);

          if (memo.messageType === 'voicememo') {
            messageType = 'Voice Memo';
            sourceHtml = '<div class="icon voice-memo-icon main-icon"></div>';
            globeOrLockIcon = publicSharedVoiceMemos.includes(memo.messageId) ? 'globe-icon' : 'lock-icon';
          } else {
            messageType = 'Message';
            sourceHtml = `<div class="container creator"><img class="c-letter" src="${imageUrl}" style="width: 30px; height: 30px; border-radius:50%;"><span class="tooltip">${memo.creator}</span></div>`;
            globeOrLockIcon = memo.isPrivate ? 'lock-icon' : 'globe-icon';
          }

          const sourceDiv = document.createElement('div');
          sourceDiv.innerHTML = `   <div class="source-content-wrapper">
      ${sourceHtml}
      <div class="text-content">
        <h3 class="title">${memo.messageName}</h3>
        <div class="metadata-voice-memo">
          <div class="date-time">
          <div class="icon ${globeOrLockIcon}"></div>
            <span>${formattedDateTime}</span>
          </div>
          <div class="sound-info">
            <div class="icon sound-bar-icon"></div>
            <span>${convertMillisecondsToMinutesSeconds(memo.durationMs)}</span>
          </div>
        </div>
      </div>
    </div>`;
          voiceMemoSources.appendChild(sourceDiv);

          // Add separator if not the last item
          if (index < presentation.messages.length - 1) {
            const separator = document.createElement('span');
            separator.textContent = '  ';
            separator.style.margin = '0 8px';
            voiceMemoSources.appendChild(separator);
          }
        });
        // End. Display all sources

        // Create details block
        const detailsBlock = document.createElement('div');
        detailsBlock.className = 'details-block';
        detailsBlock.style.display = 'none';
        // Populate details block
        detailsBlock.innerHTML = `
      <button class="action-button results-btn">See Results <span class="progressButton" id="progress2"></span></button>
      <button class="action-button slides-btn">Create Slides <span class="progressButton" id="progress2"></span></button>
    `;

        // Add click handlers for buttons
        const resultsBtn = detailsBlock.querySelector('.results-btn');
        const slidesBtn = detailsBlock.querySelector('.slides-btn');

        resultsBtn.addEventListener('click', (e) => {
          e.stopPropagation();

          const progress = e.target.querySelector('.progressButton');
          progress.style.display = 'inline-flex';
          disableAllInteractions();

          hideMessage('message-tab-1');
          const height = window.innerHeight;
          google.script.run
            .withSuccessHandler(onShowResultsSuccess)
            .withFailureHandler(onExportFailure)
            .showResultsScreen(presentation, height);
        });

        slidesBtn.addEventListener('click', (e) => {
          e.stopPropagation();

          const progress = e.target.querySelector('.progressButton');
          progress.style.display = 'inline-block';

          disableAllInteractions();
          hideMessage('message-tab-1');
          google.script.run
            .withSuccessHandler(onExportSuccess)
            .withFailureHandler(onExportFailure)
            .createSlides(outlinesJson, additionalSuggestionsJson);
        });

        // Add click handler for item
        item.addEventListener('click', () => {
          hideMessage('message-tab-1');
          if (currentDetailsBlock && currentDetailsBlock !== detailsBlock) {

            currentDetailsBlockParent = currentDetailsBlock.parentElement;
            currentDetailsBlockParent.classList.remove('selectedItem');
            currentDetailsBlock.style.display = 'none';

            const voiceMemoSourcesDiv = currentDetailsBlockParent.querySelector('.voice-memo-sources');
            voiceMemoSourcesDiv.style.display = 'none';

          }

          if (detailsBlock.style.display === 'none') {
            detailsBlock.style.display = 'flex';
            voiceMemoSources.style.display = 'flex';
            currentDetailsBlock = detailsBlock;
            item.classList.add('selectedItem');
          } else {
            detailsBlock.style.display = 'none';
            voiceMemoSources.style.display = 'none';
            currentDetailsBlock = null;
            item.classList.remove('selectedItem');
          }
        });
        // End. Add click handler for item

        outlineList.appendChild(item);
        item.appendChild(voiceMemoSources);
        item.appendChild(detailsBlock);

        // End. Correct AI result
      } else {
        const item = document.createElement('div');
        item.className = 'outline-item';
        item.innerHTML = `
        <div class="message error">${presentation.errorMessage} Please <a target=_blank href="https://cv.chat/contactus">tell us about the error</a>.</div>
`;
        outlineList.appendChild(item);
      }

    });

    outlinesDiv.appendChild(outlineList);
  }

  function onExportSuccess(response) {
    if (response.status === 'error') {
      errorCase(response);
    } else {
      showMessage(response.message, 'success', 'message-tab-1');
    }
    enableAllInteractions();
  }

  function onShowResultsSuccess(response) {
    if (response.status === 'error') {
      errorCase(response);
    }
    enableAllInteractions();
  }

  function onExportFailure(error) {
    showErrorModal(error);
    enableAllInteractions();
  }
</script>
