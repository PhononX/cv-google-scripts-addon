<!doctype html>
<html>
  <head>
    <title>Test</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 10px; font-size: 14px; max-width: 280px;}
      button { margin: 5px; }

      .url-container {
      width: 250px;
      background-color: #f0f0f0;
      padding: 10px;
      margin: 10px 0;
      word-wrap: break-word;
      overflow-wrap: break-word;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    
    .copy-btn, .logout {
      background-color: #4285F4;
      border: none;
      color: white;
      padding: 8px 12px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      margin: 5px 0;
      cursor: pointer;
      border-radius: 4px;
      width: 100px;
    }
    
    .logout{
      background-color: #f44251;
    }
    .logout:hover{
      background-color: #a60f1c;
    }

    .copy-btn:hover{
      background-color: #3367D6; /* Darker blue on hover */
    }
    
    .copy-notification {
      color: #4CAF50;
      font-size: 14px;
      margin-left: 10px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    </style>
  </head>
  <body>
    If you want to record a new voice memo, run Carbon Voice in the Gmail Compose window.<br>
    <img src="/icons/instruction-extension.gif" width="270" height="173">
    <hr>
    <h1>Test</h1>
    
    <div class="url-container" id="output"></div>
    <div>
      <button class="copy-btn" id="copyButton">Copy URL</button>
      <span id="notification" class="copy-notification">Copied!</span>
    </div>
    <button id="logout" class="logout">Log out</button>
    <script src="popup.js"></script>
  </body>
</html>
