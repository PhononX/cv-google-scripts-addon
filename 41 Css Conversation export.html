<style>
  /* Panels */
  h3 {
    color: #261073;
    font-size: 14px;
    font-weight: 500;
    margin: 20px 0 5px 0;
  }

  .panel {
    display: none;
  }

  .panel.active {
    display: block;
  }

  .panel p {
    margin-top: 5px;
    color: #261073;
    font-size: 14px;
  }

  .input-container {
    position: relative;
    margin: 10px 0;
  }

  input {
    width: 100%;
    padding: 8px;
    margin: 5px 0;
    box-sizing: border-box;
  }

  /* Conversation ID or link */
  textarea {
    width: 100%;
    height: 30px;
    padding: 6px 20px 6px 6px;
    box-sizing: border-box;
    border: 1px solid #EDEDF3;
    border-radius: 8px;
    font-size: 14px;
    resize: none;
    overflow-y: hidden;
    color: #261073;
  }

  textarea::placeholder {
    color: #A1A2AB;
  }

  textarea:focus {
    outline: none;
    border-color: #C3C5CE;
  }

  .clear-button {
    position: absolute;
    right: 8px;
    top: 4px;
    cursor: pointer;
    display: none;
    color: #C3C5CE;
    background: none;
    border: none;
    font-size: 18px;
    z-index: 10;
  }

  .clear-button:hover {
    color: #AFB0BA;
  }

  /* End. Conversation ID or link */

  .info-text {
    display: flex;
    align-items: center;
    color: #A1A2AB;
    font-size: 12px;
    line-height: 16px;
    padding-bottom: 10px;
  }

    background-size: contain;
    display: inline-block;
    margin-right: 5px;
    flex-shrink: 0;
  }

  hr {
    margin: 15px 0;
    border: none;
    border-top: 1px solid #F6F6FB;
    height: 1px;
  }

  /* End. Panels */

  /* Found conversation */
  .found-conversation {
    display: none;
  }

  .row {
    display: flex;
    padding: 10px 5px;
    border-top: 1px solid #e0e0e0;
    align-items: center;
    justify-content: space-between;
  }

  .label {
    color: #A1A2AB;
    font-size: 12px;
  }

  .value {
    display: flex;
    align-items: center;
    font-size: 12px;
    font-weight: 500;
    color: #261073;
    justify-content: flex-end;
  }

  .value img {
    border-radius: 2px;
    width: 20px;
    height: 20px;
    margin-right: 5px;
  }

  /* End. Found conversation */

  /* Dates */

  .date-container {
    display: flex;
    align-items: center;
    gap: 3px;
    justify-content: space-between;
  }

  .date-container input[type="date"] {
    max-width: 120px;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #EDEDF3;
    border-radius: 8px;
    font-size: 14px;
    color: #261073;
  }

  .date-container input[type="date"]:focus {
    outline: none;
    border-color: #C3C5CE;
  }

  .date-container span {
    margin: 0 5px;
    font-size: 14px;
    color: #261073;
  }

  /* End. Dates */

  /* Buttons */
  button.conversation {
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    margin: 10px 0;
  }

  button.conversation {
    background: #5E4CCE;
    color: white;
  }

  button.conversation:disabled {
    background: #b1a9e2;
    cursor: not-allowed;
  }

  button.conversation:hover:not(:disabled) {
    background: #4330b8;
  }

  /* End. Buttons */

  /* Go back button */

  button.goBack {
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    margin: 5px 0;
    color: #A1A2AB;
    background: #ffffff;
    display: flex;
    align-items: center;
    padding: 0;
  }

  button.goBack svg {
    margin-right: 6px;
  }

  button.goBack:disabled {
    background: #b1a9e2;
    cursor: not-allowed;
  }

  button.goBack:hover:not(:disabled) {
    color: #6F7077;
  }

  button.goBack:hover:not(:disabled) svg path {
    fill: #6F7077;
  }

  /* End. Go back button */

  /* Panel 2 */
  .select-container {
    position: relative;
    width: 100%;
    margin-bottom: 20px;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrapper {
    display: flex;
    border: 1px solid #EDEDF3;
    border-radius: 8px;
    width: 100%;
    margin-bottom: 10px;
    background-color: white;
    overflow: hidden;
  }

    content: '';

    background-position: center;
    background-size: contain;
    background-repeat: no-repeat;

    pointer-events: none;
  }

  .searchInput {
    border: none;
    width: 100%;
    padding: 5px 0;
    background: transparent;
    color: #261073;
    font-size: 14px;
  }

  .searchInput::placeholder {
    color: #261073;
  }

  .searchInput:disabled {
    cursor: not-allowed;
  }

  .searchInput:disabled::placeholder {
    color: #A1A2AB;
  }

  .clearButton {
    border: none;
    margin-right: 8px;
    background: none;
    cursor: pointer;
    font-size: 16px;
    color: #999;
    padding: 3px;
  }

  .clearButton:hover {
    color: #333;
  }

  .optionsList {
    display: none;
    position: absolute;
    width: 100%;
    max-height: 200px;
    overflow-y: auto;
    border: 1px solid #EDEDF3;
    background-color: #ffffff;
    z-index: 1000;
    top: 100%;
    margin-top: -1px;
    border-radius: 8px;
    scrollbar-width: thin;
  }

  .option,
  .specialOption {
    padding: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
  }

  .specialOption {
    border-bottom: 1px solid #BAA9FF;
  }

  .option:hover,
  .option.highlighted {
    background-color: #F2EFFF;
  }

  .specialOption:hover,
  .specialOption.highlighted {
    background-color: #F2EFFF;
  }

  /* Icon styles for options */
  .option-icon,
  .special-option-icon,
  .input-icon {
    border-radius: 4px;
    width: 20px;
    height: 20px;
    margin-right: 8px;
    background-size: contain;
    background-repeat: no-repeat;
    flex-shrink: 0;
  }

  .input-with-icon input {
    border: none;
    flex-grow: 1;
    padding: 5px 0;
  }

  .input-with-icon input:focus {
    outline: none;
  }

  .input-with-icon {
    display: flex;
    align-items: center;
    flex-grow: 1;
    padding: 5px 10px;
    background-color: #ffffff;
  }

  /* End. Panel 2 */
