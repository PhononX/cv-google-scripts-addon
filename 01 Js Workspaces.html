<script>
  function populateWorkspaces(allWorkspaces) {

    const bottomPanel = document.getElementById('bottomPanel');
    bottomPanel.style.display = 'none';

            const container = document.getElementById('breadcrumbs-container');
            container.innerHTML = '';

    const outlinesDiv = document.getElementById('outlines');
    outlinesDiv.innerHTML = ``;

    const workspacesList = document.createElement('div');
    workspacesList.className = 'outline-list';

  allWorkspaces.forEach(workspace => {
    const item = document.createElement('div');
    item.className = 'folder-item';
    item.innerHTML = `<div class="folder-icon-workspace">
            <img src="${workspace.workspaceImageUrl}">
        </div>
        <div class="folder-content">
            <h3 class="folder-title">${workspace.workspaceName}</h3>
            <p class="folder-details">${workspace.nestedFoldersCount} Folders<br>${workspace.nestedMessagesCount} Voice Memos</p>
        </div>
        <span class="angle-bracket">›</span>`;


    item.addEventListener('click', (e) => {
      e.stopPropagation();

      disableAllInteractions();
      hideMessage('messageConversations'); 

      google.script.run
          .withSuccessHandler(onRefreshSuccess)
          .withFailureHandler(onExportFailure)     
          .getVoiceMemosAndFolders(workspace.workspaceId);     
    });

    workspacesList.appendChild(item);
  });
 outlinesDiv.appendChild(workspacesList);
  }
</script>
